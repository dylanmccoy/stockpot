name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  integration:
    # Deployment ticket 01c: the existing real-backend Playwright integration
    # suite (playwright.integration.config.ts) — the real SPA driving a real
    # FastAPI process through the Vite dev proxy, on dedicated ports against a
    # disposable SQLite database the harness owns. Separate from
    # `production-smoke`, which checks the built single-origin deployment: the
    # dev-proxy suite passing must not stand in for that coverage. Needs both
    # uv (backend) and node (Vite + Playwright), so it's its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:integration
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  production-smoke:
    # Deployment ticket 01a: the built frontend served by the FastAPI app
    # itself under one origin, driving a real backend process against a
    # disposable database. Needs both uv (to run the backend) and node (to
    # build the frontend and run Playwright), so it's its own job rather than
    # a step in `backend` or `frontend`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e:production
        working-directory: frontend

  deployment:
    # Deployment ticket 04a: install and run the app through the real deploy/
    # scripts (deploy/install.sh --adopt-from + deploy/control.sh), adopting an
    # existing household database via a live snapshot and serving the built
    # frontend + API on one origin. Distinct from production-smoke: that seeds a
    # fresh database in place; this exercises data adoption through the scripts.
    #
    # Ticket 04b adds the `deployment-update` run in the same job: it drives
    # deploy/update.sh against the started deployment (validate build →
    # pre-maintenance snapshot → stop → switch → restart on the same explicit
    # database) and checks records and later writes survive the replacement build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e:deployment
        working-directory: frontend
      - run: npm run test:e2e:deployment-update
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-deployment-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
